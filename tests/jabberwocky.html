<!doctype html>
<html lang="en-GB">
<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<title>wrap-chars</title>

    <style>
        *.wrapped
        {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <blockquote id="jabberwocky" class="centerpiece">
        <span class="line">’Twas brillig, and the slithy toves</span><br>
        <span class="line">Did gyre and gimble in the wabe:</span><br>
        <span class="line">All mimsy were the borogoves,</span><br>
        <span class="line">And the mome raths outgrabe.</span>
    </blockquote>


    <script type="module">
        import WrapChars from '../src/WrapChars.js';

        let node = document.querySelector('*.centerpiece');

        WrapChars.wrap(node, {className: 'wrapped'});
    </script>

</body>

</html>
