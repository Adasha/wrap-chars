<!doctype html>
<html lang="en-GB">
<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<title>wrap-chars test suite</title>
    <link rel="stylesheet" href="testsuite.css">

</head>

<body>

    <aside id="controls" aria-label="Options">

        <header>
            <h1>wrap-chars</h1>
            <p>Test suite</p>
        </header>

        <p id="summary" role="status" data-state="idle">Running…</p>

        <nav aria-label="Test groups">
            <ul id="group_nav"></ul>
        </nav>

        <form id="options" onsubmit="return false">

            <fieldset>
                <legend>Preset</legend>

                <div class="field">
                    <label for="sel_preset">Option set</label>
                    <select id="sel_preset" name="sel_preset"></select>
                </div>

                <label class="check" for="cb_outline">
                    <input id="cb_outline" name="cb_outline" type="checkbox">
                    <span>Outline every piece</span>
                </label>
            </fieldset>

            <fieldset>
                <legend>Splitting</legend>

                <div class="field">
                    <label for="sel_split">Split method</label>
                    <select id="sel_split" name="sel_split">
                        <option value="letter" selected>Letter</option>
                        <option value="word">Word</option>
                    </select>
                </div>

                <label class="check" for="cb_deep">
                    <input id="cb_deep" name="cb_deep" type="checkbox" checked>
                    <span>Parse full tree</span>
                </label>

                <div class="field">
                    <label for="txt_skip">Class to skip</label>
                    <input id="txt_skip" name="txt_skip" type="text">
                </div>
            </fieldset>

            <fieldset>
                <legend>Output</legend>

                <div class="field">
                    <label for="txt_tag">Tag name</label>
                    <input id="txt_tag" name="txt_tag" type="text" value="span" placeholder="(do not include brackets)">
                </div>

                <div class="field">
                    <label for="txt_class">Class name</label>
                    <input id="txt_class" name="txt_class" type="text" value="test_class">
                </div>

                <label class="check" for="cb_a11y">
                    <input id="cb_a11y" name="cb_a11y" type="checkbox" checked>
                    <span>Accessible (screen-reader copy)</span>
                </label>
            </fieldset>

            <fieldset>
                <legend>Spaces</legend>

                <label class="check" for="cb_spaces">
                    <input id="cb_spaces" name="cb_spaces" type="checkbox">
                    <span>Wrap spaces</span>
                </label>

                <div class="field">
                    <label for="txt_space">Replace spaces with</label>
                    <input id="txt_space" name="txt_space" type="text">
                </div>
            </fieldset>

            <fieldset>
                <legend>Punctuation</legend>

                <label class="check" for="cb_punct">
                    <input id="cb_punct" name="cb_punct" type="checkbox">
                    <span>Separate punctuation (word mode)</span>
                </label>

                <div class="field">
                    <label for="txt_punct">Punctuation class</label>
                    <input id="txt_punct" name="txt_punct" type="text" value="test_punct">
                </div>
            </fieldset>

            <div class="actions">
                <button type="button" id="btn_apply" class="primary">Apply</button>
                <button type="button" id="btn_unwrap">Unwrap</button>
            </div>
            <output id="out_error" role="alert"></output>

        </form>

    </aside>



    <main id="cases"></main>



    <script type="module" src="testsuite.js"></script>


</body>
</html>
